[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor/

[program:django]
command=gunicorn Sefro_Clinic.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 60 --access-logfile /var/log/supervisor/gunicorn_access.log --error-logfile /var/log/supervisor/gunicorn_error.log
directory=/srv/backend
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/django.log
stderr_logfile=/var/log/supervisor/django_err.log
environment=DJANGO_SETTINGS_MODULE=Sefro_Clinic.settings,PYTHONPATH=/srv/backend

[program:nextjs]
command=node server.js
directory=/srv/website
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/nextjs.log
stderr_logfile=/var/log/supervisor/nextjs_err.log
environment=NODE_ENV=production,PORT=3000,HOSTNAME=0.0.0.0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log